<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dash Architect — dashboard</title>
<style>
:root { color-scheme: light dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#F2F4F0}
.toolbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 20px;background:#17231F;color:#fff;font-size:13px;
}
.toolbar label{display:flex;align-items:center;gap:8px}
.toolbar input[type=file]{color:#fff}
.themes{display:flex;gap:6px}
.themes button{
  font:inherit;font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);
  background:transparent;color:#fff;cursor:pointer;
}
.themes button[aria-pressed="true"]{background:#fff;color:#17231F;border-color:#fff}
.status{color:rgba(255,255,255,.7)}
.stage{padding:28px 20px 60px;display:flex;justify-content:center}
.stage-inner{max-width:1240px;width:100%}
#mount{margin:0 auto}
</style>
</head>
<body>

<div class="toolbar">
  <strong>Dash Architect</strong>
  <label>Data<input type="file" id="file" accept=".csv,text/csv"></label>
  <div class="themes" id="themes" role="group" aria-label="Theme">
    <button type="button" data-theme="light" aria-pressed="true">Light</button>
    <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
    <button type="button" data-theme="report" aria-pressed="false">Report</button>
    <button type="button" data-theme="print" aria-pressed="false">Print</button>
  </div>
  <span class="status" id="status">Using the bundled Store sales, 2025 fixture</span>
</div>

<div class="stage">
  <div class="stage-inner">
    <div id="mount"></div>
  </div>
</div>

<script src="../engine/values.js"></script>
<script src="../engine/csv.js"></script>
<script src="../engine/profile.js"></script>
<script src="../engine/roles.js"></script>
<script src="../engine/aggregate.js"></script>
<script src="../engine/layout.js"></script>
<script src="../engine/index.js"></script>
<script src="format.js"></script>
<script src="palettes.js"></script>
<script src="themes.js"></script>
<script src="svg.js"></script>
<script src="share.js"></script>
<script src="dom.js"></script>
<script>
(() => {
  'use strict';
  const els = { file: document.getElementById('file'), themes: document.getElementById('themes'), status: document.getElementById('status'), mount: document.getElementById('mount') };
  let controller = null;
  let currentThemeId = 'light';

  function titleFromFilename(name) {
    return name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
  }

  function build(analysis, title) {
    els.mount.innerHTML = '';
    const theme = window.DashRenderThemes.THEMES[currentThemeId];
    controller = window.DashRenderDom.mount(els.mount, analysis, theme, {
      title: title || 'Dashboard',
      subtitle: `${analysis.rowCount.toLocaleString('en-US')} rows`,
    });
  }

  function loadCsvText(text, title) {
    const analysis = window.DashEngine.analyzeCsv(text);
    build(analysis, title);
  }

  els.file.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    els.status.textContent = `Loading ${file.name}…`;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        loadCsvText(String(reader.result), titleFromFilename(file.name));
        els.status.textContent = file.name;
      } catch (err) {
        els.status.textContent = 'Could not read this file: ' + (err && err.message ? err.message : String(err));
      }
    };
    reader.readAsText(file);
  });

  els.themes.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-theme]');
    if (!btn) return;
    currentThemeId = btn.dataset.theme;
    [...els.themes.querySelectorAll('button')].forEach((b) => b.setAttribute('aria-pressed', b === btn));
    if (controller) controller.setTheme(window.DashRenderThemes.THEMES[currentThemeId]);
  });

  fetch('/fixtures/01_sales_timeseries.csv')
    .then((r) => r.text())
    .then((text) => loadCsvText(text, 'Store sales, 2025'))
    .catch(() => { els.status.textContent = 'No bundled fixture found — choose a CSV above.'; });
})();
</script>
</body>
</html>
