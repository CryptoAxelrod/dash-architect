<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Dash Architect</title>
<link rel="stylesheet" href="dashboard-dialog.css?v=1.13">
<link rel="stylesheet" href="theme-picker.css?v=1.13">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>

<div class="toolbar">
  <div class="themes" id="dlg-themes">
    <button type="button" data-theme="light" aria-pressed="true">Light</button>
    <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
    <button type="button" data-theme="report" aria-pressed="false">Report</button>
    <button type="button" data-theme="print" aria-pressed="false">Print</button>
  </div>
  <!-- TEMPORARY — see addin/version.js; remove this span with it before release. -->
  <span class="version-badge" id="dlg-version-badge" title="Build marker — confirms which deploy actually loaded"></span>
  <div class="toolbar-actions" id="dlg-live-actions" hidden>
    <span class="source-label" id="dlg-source"></span>
    <span class="refreshed-at" id="dlg-refreshed-at"></span>
    <button type="button" class="tbtn" id="dlg-refresh">Refresh</button>
    <button type="button" class="tbtn tbtn-icon" id="dlg-settings-toggle" title="Dashboard settings" aria-label="Dashboard settings">⚙</button>
  </div>
  <p class="status" id="dlg-status" hidden></p>
</div>
<div class="banner" id="dlg-banner" hidden></div>
<div class="stage"><div class="inner" id="dlg-mount"></div></div>

<div class="settings-panel" id="dlg-settings" hidden>
  <div class="settings-head">
    <h2>Dashboard settings</h2>
    <button type="button" class="tbtn" id="dlg-settings-close">Close</button>
  </div>
  <div class="settings-section">
    <h3>Data source</h3>
    <button type="button" class="tbtn" id="dlg-change-range">Change data range</button>
  </div>
  <div class="settings-section">
    <h3>Theme &amp; palette</h3>
    <div id="dlg-theme-picker"></div>
  </div>
  <div class="settings-section">
    <h3>Filters</h3>
    <div id="dlg-settings-filters"></div>
  </div>
  <div class="settings-section">
    <h3>KPI cards</h3>
    <div id="dlg-settings-kpis"></div>
  </div>
  <div class="settings-section">
    <h3>Charts</h3>
    <div id="dlg-settings-charts"></div>
  </div>
  <div class="settings-section">
    <h3>Table</h3>
    <div id="dlg-settings-table-columns"></div>
  </div>
  <div class="settings-section">
    <h3>Sections</h3>
    <label class="settings-row"><input type="checkbox" id="dlg-cfg-table" checked> Table</label>
    <label class="settings-row"><input type="checkbox" id="dlg-cfg-filters" checked> Filters</label>
  </div>
</div>

<script src="../engine/values.js?v=1.13"></script>
<script src="../engine/csv.js?v=1.13"></script>
<script src="../engine/clean.js?v=1.13"></script>
<script src="../engine/profile.js?v=1.13"></script>
<script src="../engine/roles.js?v=1.13"></script>
<script src="../engine/aggregate.js?v=1.13"></script>
<script src="../engine/layout.js?v=1.13"></script>
<script src="../engine/reconcile.js?v=1.13"></script>
<script src="../engine/index.js?v=1.13"></script>
<script src="../render/format.js?v=1.13"></script>
<script src="../render/palettes.js?v=1.13"></script>
<script src="../render/themes.js?v=1.13"></script>
<script src="../render/svg.js?v=1.13"></script>
<script src="../render/share.js?v=1.13"></script>
<script src="../render/dom.js?v=1.13"></script>
<script src="theme-picker.js?v=1.13"></script>
<script src="dialog-messaging.js?v=1.13"></script>
<!-- TEMPORARY — see addin/version.js; remove before release. -->
<script src="version.js?v=1.13"></script>
<script src="dashboard-dialog.js?v=1.13"></script>
</body>
</html>
