<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store sales, 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

<style>
:root{
  --paper:#EEF1EC; --panel:#FAFBF9; --ink:#17231F; --muted:#5B6964; --rule:#D2D9D3; --rule-soft:#E4E9E5;
  --green:#1D6F4C; --green-dark:#14523A; --green-mid:#6FA388; --green-soft:#C6DDD0;
  --loss:#B23A24; --loss-soft:#E7B9AE;
  font-family:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  color:var(--ink); background:var(--paper);
}
*{box-sizing:border-box}
body{margin:0;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:34px 28px 52px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* Header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px 24px;flex-wrap:wrap}
h1{margin:0;font-size:31px;line-height:1.1;font-weight:700;font-stretch:112%;letter-spacing:-.01em}
.lede{margin:6px 0 0;color:var(--muted);font-size:14.5px}

.seg{display:inline-flex;background:#DFE6E0;border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;font:inherit;font-size:14px;font-weight:560;color:var(--muted);padding:6px 15px;border-radius:999px;cursor:pointer}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg.small{background:#E7ECE8}
.seg.small button{font-size:13px;padding:4px 12px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 30px}
.chip{font:inherit;font-size:14px;border:1px solid var(--rule);background:transparent;color:var(--ink);padding:6px 13px;border-radius:999px;cursor:pointer}
.chip:hover:not([aria-pressed="true"]){border-color:var(--green-mid)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}

/* Overview: KPIs + chart */
.overview{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:44px;align-items:stretch}
.kpis{display:flex;flex-direction:column}
.kpi-label{margin:0;font-size:14px;color:var(--muted)}
.kpi-value{margin:0;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi-value.loss{color:var(--loss)}
.kpi-sub{margin:0;font-size:13.5px;color:var(--muted)}
.hero .kpi-value{font-size:62px;line-height:1;font-stretch:125%;font-weight:760;letter-spacing:-.025em;margin:10px 0 10px}
.kpi-row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,.9fr);margin-top:auto;padding-top:20px;border-top:1px solid var(--rule)}
.kpi-row>div{padding-right:14px}
.kpi-row>div+div{border-left:1px solid var(--rule);padding-left:18px}
.kpi-row .kpi-value{font-size:28px;line-height:1.1;font-stretch:115%;margin:6px 0 5px}
.hero{margin-bottom:26px}

.panel{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:18px 20px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:8px}
h2{margin:0;font-size:17px;font-weight:650;font-stretch:106%}
h2 .count{color:var(--muted);font-weight:450;margin-left:6px}

/* Chart */
.chart{position:relative;height:236px}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart text{font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .peak{fill:var(--ink);font-weight:650}
.grid line{stroke:var(--rule);stroke-dasharray:2 3}
.grid line.zero{stroke:#AEB9B2;stroke-dasharray:none}
.hit{fill:transparent}
.col{outline:none;cursor:default}
.col:hover .hit,.col:focus-visible .hit{fill:rgba(29,111,76,.07)}
.col:focus-visible .hit{stroke:var(--green);stroke-width:1.5}
.bar{fill:var(--green-soft);transform-box:fill-box;transform-origin:50% 100%}
.bar.top{fill:var(--green)}
.bar.neg{fill:var(--loss-soft);transform-origin:50% 0}
.col:hover .bar:not(.top):not(.neg),.col:focus-visible .bar:not(.top):not(.neg){fill:var(--green-mid)}
.col:hover .bar.top{fill:var(--green-dark)}
.chart.animate .bar{animation:grow .38s cubic-bezier(.2,.7,.3,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.35;white-space:nowrap;
  display:grid;grid-template-columns:auto auto;column-gap:14px;row-gap:1px;transform:translate(-50%,calc(-100% - 10px))}
.tip[hidden]{display:none}
.tip strong{grid-column:1/-1;font-weight:650;margin-bottom:4px}
.tip span{color:#B9C6C0}
.tip b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* Table */
.table-panel{margin-top:34px}
.tools{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.search{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--rule);border-radius:7px;background:#fff;color:var(--ink);width:230px;max-width:100%}
.search::placeholder{color:#8A968F}
.switch{display:inline-flex;align-items:center;gap:9px;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;padding:4px 2px;cursor:pointer}
.switch .track{position:relative;width:34px;height:20px;border-radius:999px;background:#C3CCC6;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"] .track{background:var(--loss)}
.switch[aria-checked="true"] .track::after{transform:translateX(14px)}

.table-wrap{overflow-x:auto;margin:6px -20px 0}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
th,td{padding:9px 20px;text-align:left;white-space:nowrap}
th{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--rule)}
th.r,td.r{text-align:right}
th button{font:inherit;color:inherit;background:none;border:0;padding:2px 0;cursor:pointer}
th button:hover,th[aria-sort] button{color:var(--ink)}
th .dir{display:inline-block;width:12px;text-align:center}
th[aria-sort="ascending"] .dir::after{content:"↑"}
th[aria-sort="descending"] .dir::after{content:"↓"}
td{font-variant-numeric:tabular-nums}
tbody tr+tr td{border-top:1px solid var(--rule-soft)}
tbody tr:hover td{background:#F1F5F2}
tbody td.empty{white-space:normal;text-align:center;color:var(--muted);padding:34px 20px}
tfoot td{font-weight:700;border-top:1.5px solid var(--ink)}
.neg{color:var(--loss)}
.mbar{display:inline-block;vertical-align:middle;width:46px;height:6px;border-radius:3px;background:var(--rule-soft);margin-right:10px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--green-mid);border-radius:3px}
.mbar i.neg{background:var(--loss)}
.pv{display:inline-block;min-width:3.4em;text-align:right}

.pager{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-top:14px;font-size:13.5px;color:var(--muted)}
.pager .ctrl{display:flex;align-items:center;gap:8px}
.pager select,.pager button{font:inherit;font-size:13.5px;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:7px;padding:5px 10px}
.pager button{cursor:pointer}
.pager button:disabled{opacity:.45;cursor:default}

@media (max-width:880px){
  .overview{grid-template-columns:1fr;gap:30px}
  .hero .kpi-value{font-size:52px}
}
@media (max-width:540px){
  .wrap{padding:22px 16px 40px}
  h1{font-size:25px}
  .seg button{padding:6px 12px}
  .hero .kpi-value{font-size:44px}
  .kpi-row{grid-template-columns:1fr 1fr;row-gap:16px}
  .kpi-row>div:nth-child(3){grid-column:1/-1;border-left:0;padding-left:0;padding-top:14px;border-top:1px solid var(--rule)}
  .kpi-row .kpi-value{font-size:24px}
  .panel{padding:16px 14px}
  .table-wrap{margin:6px -14px 0}
  th,td{padding:9px 14px}
  .search{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <h1>Store sales, 2025</h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="seg" role="group" aria-label="Period" id="period">
      <button type="button" data-v="Y" aria-pressed="true">Full year</button>
      <button type="button" data-v="Q1" aria-pressed="false">Q1</button>
      <button type="button" data-v="Q2" aria-pressed="false">Q2</button>
      <button type="button" data-v="Q3" aria-pressed="false">Q3</button>
      <button type="button" data-v="Q4" aria-pressed="false">Q4</button>
    </div>
  </header>

  <div class="chips" role="group" aria-label="Product categories" id="chips"></div>

  <section class="overview">
    <div class="kpis">
      <div class="hero">
        <p class="kpi-label">Total sales</p>
        <p class="kpi-value" id="kSales"></p>
        <p class="kpi-sub" id="kSalesSub"></p>
      </div>
      <div class="kpi-row">
        <div>
          <p class="kpi-label">Net profit</p>
          <p class="kpi-value" id="kProfit"></p>
          <p class="kpi-sub" id="kProfitSub"></p>
        </div>
        <div>
          <p class="kpi-label">Margin</p>
          <p class="kpi-value" id="kMargin"></p>
          <p class="kpi-sub" id="kMarginSub"></p>
        </div>
        <div>
          <p class="kpi-label">Transactions</p>
          <p class="kpi-value" id="kCount"></p>
          <p class="kpi-sub" id="kCountSub"></p>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2 id="chartTitle">Sales by month</h2>
        <div class="seg small" role="group" aria-label="Chart metric" id="metric">
          <button type="button" data-v="sales" aria-pressed="true">Sales</button>
          <button type="button" data-v="profit" aria-pressed="false">Profit</button>
          <button type="button" data-v="margin" aria-pressed="false">Margin</button>
        </div>
      </div>
      <div class="chart" id="chart">
        <div class="tip" id="tip" hidden></div>
        <div id="svgHost" style="height:100%"></div>
      </div>
    </div>
  </section>

  <section class="panel table-panel">
    <div class="panel-head">
      <h2>Sales<span class="count" id="tCount"></span></h2>
      <div class="tools">
        <label class="sr" for="search">Search by category or date</label>
        <input class="search" id="search" type="search" placeholder="Search category or date" autocomplete="off">
        <button type="button" class="switch" role="switch" aria-checked="false" id="lossOnly">
          <span class="track" aria-hidden="true"></span>Losses only
        </button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-key="date" aria-sort="ascending"><button type="button">Date<span class="dir" aria-hidden="true"></span></button></th>
            <th data-key="cat"><button type="button">Product category<span class="dir" aria-hidden="true"></span></button></th>
            <th data-key="sales" class="r"><button type="button"><span class="dir" aria-hidden="true"></span>Sales amount</button></th>
            <th data-key="profit" class="r"><button type="button"><span class="dir" aria-hidden="true"></span>Net profit</button></th>
            <th data-key="margin" class="r"><button type="button"><span class="dir" aria-hidden="true"></span>Margin</button></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot id="tfoot"></tfoot>
      </table>
    </div>
    <div class="pager">
      <span id="range"></span>
      <div class="ctrl">
        <label for="perPage">Rows per page</label>
        <select id="perPage"><option>15</option><option>30</option><option>50</option></select>
        <button type="button" id="prev">Previous</button>
        <button type="button" id="next">Next</button>
      </div>
    </div>
  </section>
</main>

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAY = 864e5;
const usd0 = new Intl.NumberFormat('en-US', {style:'currency', currency:'USD', maximumFractionDigits:0});
const usd2 = new Intl.NumberFormat('en-US', {style:'currency', currency:'USD', minimumFractionDigits:2, maximumFractionDigits:2});
const money = (v, f = usd2) => (v < 0 ? '−' : '') + f.format(Math.abs(v));
const pct = (v, d = 1) => (v < 0 ? '−' : '') + (Math.abs(v) * 100).toFixed(d) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum = (list, k) => list.reduce((a, r) => a + r[k], 0);
const $ = id => document.getElementById(id);
const shortMoney = v => {
  const a = Math.abs(v), s = v < 0 ? '−' : '';
  return a >= 1000 ? s + '$' + (a / 1000).toFixed(a % 1000 === 0 ? 0 : 1) + 'k' : s + '$' + Math.round(a);
};
const shortDate = t => { const d = new Date(t); return MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate(); };

const rows = DATA.map(([date, cat, sales, profit], i) => {
  const y = +date.slice(0, 4), m = +date.slice(5, 7), d = +date.slice(8, 10);
  return { i, date, cat, sales, profit, margin: sales ? profit / sales : 0, month: m, q: Math.ceil(m / 3),
           t: Date.UTC(y, m - 1, d), label: `${MONTHS[m - 1]} ${d}, ${y}` };
});
const CATS = [...new Set(rows.map(r => r.cat))].sort();

const state = { period:'Y', cats:new Set(), metric:'sales', search:'', lossOnly:false,
                sortKey:'date', sortDir:'asc', page:1, perPage:15 };
let base = [];
let chartGeom = null;

/* ---------- filters ---------- */
function scoped() {
  const q = state.period === 'Y' ? 0 : +state.period.slice(1);
  return rows.filter(r => (!q || r.q === q) && (state.cats.size === 0 || state.cats.has(r.cat)));
}

/* ---------- header ---------- */
function renderLede() {
  const catCount = new Set(base.map(r => r.cat)).size;
  const when = state.period === 'Y' ? 'in 2025' : `in ${state.period} 2025`;
  $('lede').textContent = `${base.length} ${base.length === 1 ? 'sale' : 'sales'} ${when} across ${catCount} ${catCount === 1 ? 'category' : 'categories'}`;
}

/* ---------- KPIs ---------- */
function renderKPIs() {
  const n = base.length, S = sum(base, 'sales'), P = sum(base, 'profit');
  const days = new Set(base.map(r => r.date)).size;
  const losses = base.filter(r => r.profit < 0).length;

  $('kSales').textContent = usd0.format(S);
  $('kSalesSub').textContent = n ? `Avg ${money(S / n, usd0)} per transaction` : 'No transactions';

  $('kProfit').textContent = money(P, usd0);
  $('kProfit').classList.toggle('loss', P < 0);
  $('kProfitSub').textContent = losses ? `${losses} ${losses === 1 ? 'sale' : 'sales'} at a loss` : 'No sales at a loss';

  $('kMargin').textContent = S ? pct(P / S) : '—';
  const byCat = {};
  base.forEach(r => { (byCat[r.cat] ||= {S:0, P:0}); byCat[r.cat].S += r.sales; byCat[r.cat].P += r.profit; });
  const cats = Object.entries(byCat).map(([cat, v]) => ({ cat, m: v.S ? v.P / v.S : 0 }));
  if (cats.length > 1) {
    const best = cats.reduce((a, b) => b.m > a.m ? b : a);
    $('kMarginSub').textContent = `Best: ${best.cat}, ${pct(best.m)}`;
  } else if (n) {
    const ms = base.map(r => r.margin).sort((a, b) => a - b);
    const med = ms.length % 2 ? ms[(ms.length - 1) / 2] : (ms[ms.length / 2 - 1] + ms[ms.length / 2]) / 2;
    $('kMarginSub').textContent = `Median per sale: ${pct(med)}`;
  } else {
    $('kMarginSub').textContent = '';
  }

  $('kCount').textContent = n.toLocaleString('en-US');
  $('kCountSub').textContent = `On ${days} trading ${days === 1 ? 'day' : 'days'}`;
}

/* ---------- chart ---------- */
function buckets() {
  if (state.period === 'Y') {
    return MONTHS.map((label, idx) => ({ label, full: `${MONTHS_FULL[idx]} 2025`, items: base.filter(r => r.month === idx + 1) }));
  }
  const q = +state.period.slice(1);
  const start = Date.UTC(2025, (q - 1) * 3, 1), end = Date.UTC(2025, q * 3, 1);
  const out = [];
  for (let s = start; s < end;) {
    const dow = (new Date(s).getUTCDay() + 6) % 7;           // Monday = 0
    const e = Math.min(s + (7 - dow) * DAY, end);
    const a = s, b = e;
    out.push({ label: shortDate(a), full: a === b - DAY ? shortDate(a) : `${shortDate(a)} – ${shortDate(b - DAY)}`,
               items: base.filter(r => r.t >= a && r.t < b) });
    s = e;
  }
  return out;
}

function niceStep(x) {
  if (!(x > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(x))), f = x / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
}

      barTop = yTop;
      const cls = b.v < 0 ? 'bar neg' : i === best ? 'bar top' : 'bar';
      bar = `<rect class="${cls}" x="${(cx - bw / 2).toFixed(1)}" y="${yTop.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" style="animation-delay:${i * 18}ms"/>`;
    }
    geom.push({ cx, barTop });
    const valText = b.v == null ? 'no sales' : metric === 'margin' ? pct(b.v) : money(b.v, usd0);
    svg += `<g class="col" tabindex="0" data-i="${i}" role="img" aria-label="${esc(b.full)}: ${esc(valText)}">` +
           `<rect class="hit" x="${(pad.l + band * i).toFixed(1)}" y="${pad.t}" width="${band.toFixed(1)}" height="${ph}" rx="3"/>${bar}</g>`;
    if (i % every === 0) svg += `<text x="${cx.toFixed(1)}" y="${H - 7}" text-anchor="middle">${esc(b.label)}</text>`;
  });
  if (best >= 0) {
    const b = bs[best], lbl = metric === 'margin' ? pct(b.v) : shortMoney(b.v);
    svg += `<text class="peak" x="${geom[best].cx.toFixed(1)}" y="${Math.max(12, geom[best].barTop - 7).toFixed(1)}" text-anchor="middle">${lbl}</text>`;
  }
  svg += '</svg>';

  chart.classList.toggle('animate', !!animate);
  host.innerHTML = svg;
  chartGeom = { bs, geom };
  $('tip').hidden = true;
}

function showTip(i) {
  if (!chartGeom) return;
  const b = chartGeom.bs[i], g = chartGeom.geom[i], tip = $('tip');
  tip.innerHTML = `<strong>${esc(b.full)}</strong>` +
    `<span>Sales</span><b>${money(b.S, usd0)}</b>` +
    `<span>Net profit</span><b>${money(b.P, usd0)}</b>` +
    `<span>Margin</span><b>${b.S ? pct(b.P / b.S) : '—'}</b>` +
    `<span>Transactions</span><b>${b.n}</b>`;
  tip.hidden = false;
  const W = $('chart').clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
  const left = Math.min(Math.max(g.cx, tw / 2), W - tw / 2);
  tip.style.left = left + 'px';
  tip.style.top = Math.max(g.barTop, th + 10) + 'px';
}

/* ---------- table ---------- */
function tableRows() {
  const q = state.search.trim().toLowerCase();
  let list = base.filter(r =>
    (!state.lossOnly || r.profit < 0) &&
    (!q || r.cat.toLowerCase().includes(q) || r.date.includes(q) || r.label.toLowerCase().includes(q)));
  const k = state.sortKey, dir = state.sortDir === 'asc' ? 1 : -1;
  return list.sort((a, b) => {
    const c = k === 'cat' ? a.cat.localeCompare(b.cat) : k === 'date' ? a.t - b.t : a[k] - b[k];
    return (c || a.i - b.i) * dir;
  });
}

function renderTable() {
  const list = tableRows();
  const pages = Math.max(1, Math.ceil(list.length / state.perPage));
  state.page = Math.min(state.page, pages);
  const from = (state.page - 1) * state.perPage;
  const pageRows = list.slice(from, from + state.perPage);

  $('tbody').innerHTML = pageRows.length ? pageRows.map(r => {
    const w = Math.min(Math.abs(r.margin) / 0.35, 1) * 100;
    return `<tr><td>${r.label}</td><td>${esc(r.cat)}</td>` +
      `<td class="r">${money(r.sales)}</td>` +
      `<td class="r${r.profit < 0 ? ' neg' : ''}">${money(r.profit)}</td>` +
      `<td class="r${r.margin < 0 ? ' neg' : ''}"><span class="mbar" aria-hidden="true"><i class="${r.margin < 0 ? 'neg' : ''}" style="width:${w.toFixed(0)}%"></i></span><span class="pv">${pct(r.margin)}</span></td></tr>`;
  }).join('') : `<tr><td class="empty" colspan="5">No sales match these filters. Clear the search or turn off Losses only.</td></tr>`;

  const S = sum(list, 'sales'), P = sum(list, 'profit');
  $('tfoot').innerHTML = list.length ?
    `<tr><td>Total</td><td>${list.length} ${list.length === 1 ? 'sale' : 'sales'}</td><td class="r">${money(S)}</td>` +
    `<td class="r${P < 0 ? ' neg' : ''}">${money(P)}</td><td class="r${P < 0 ? ' neg' : ''}">${S ? pct(P / S) : '—'}</td></tr>` : '';

  $('tCount').textContent = list.length;
  $('range').textContent = list.length ? `${from + 1}–${from + pageRows.length} of ${list.length}` : '0 of 0';
  $('prev').disabled = state.page <= 1;
  $('next').disabled = state.page >= pages;

  document.querySelectorAll('th[data-key]').forEach(th => {
    if (th.dataset.key === state.sortKey) th.setAttribute('aria-sort', state.sortDir === 'asc' ? 'ascending' : 'descending');
    else th.removeAttribute('aria-sort');
  });
}

/* ---------- controls ---------- */
function renderChips() {
  const host = $('chips');
  host.innerHTML = '';
  const make = (label, pressed, onClick) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = label;
    b.setAttribute('aria-pressed', pressed);
    b.addEventListener('click', onClick);
    host.appendChild(b);
  };
  make('All categories', state.cats.size === 0, () => { state.cats.clear(); update(); });
  CATS.forEach(c => make(c, state.cats.has(c), () => {
    state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c);
    if (state.cats.size === CATS.length) state.cats.clear();
    update();
  }));
  function update() {
    const focusedIndex = [...host.children].indexOf(document.activeElement);
    state.page = 1; renderChips(); renderAll(true);
    if (focusedIndex >= 0) host.children[focusedIndex].focus();
  }
}

function bindSeg(id, key, after) {
  $(id).addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn || state[key] === btn.dataset.v) return;
    state[key] = btn.dataset.v;
    $(id).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === btn));
    after();
  });
}

function renderAll(animate) {
  base = scoped();
  renderLede(); renderKPIs(); renderChart(animate); renderTable();
}

bindSeg('period', 'period', () => { state.page = 1; renderAll(true); });
bindSeg('metric', 'metric', () => renderChart(true));

$('search').addEventListener('input', e => { state.search = e.target.value; state.page = 1; renderTable(); });
$('lossOnly').addEventListener('click', e => {
  state.lossOnly = !state.lossOnly;
  e.currentTarget.setAttribute('aria-checked', state.lossOnly);
  state.page = 1; renderTable();
});
document.querySelectorAll('th[data-key] button').forEach(btn => btn.addEventListener('click', () => {
  const key = btn.parentElement.dataset.key;
  if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  else { state.sortKey = key; state.sortDir = (key === 'date' || key === 'cat') ? 'asc' : 'desc'; }
  state.page = 1; renderTable();
}));
$('perPage').addEventListener('change', e => { state.perPage = +e.target.value; state.page = 1; renderTable(); });
$('prev').addEventListener('click', () => { state.page--; renderTable(); });
$('next').addEventListener('click', () => { state.page++; renderTable(); });

const chartEl = $('chart');
chartEl.addEventListener('pointerover', e => { const g = e.target.closest('.col'); if (g) showTip(+g.dataset.i); });
chartEl.addEventListener('pointerleave', () => { $('tip').hidden = true; });
chartEl.addEventListener('focusin', e => { const g = e.target.closest('.col'); if (g) showTip(+g.dataset.i); });
chartEl.addEventListener('focusout', () => { $('tip').hidden = true; });

let raf = 0, lastW = $('svgHost').clientWidth;
new ResizeObserver(() => {
  const w = $('svgHost').clientWidth;
  if (w === lastW) return;
  lastW = w;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => renderChart(false));
}).observe($('svgHost'));

renderChips();
renderAll(true);
})();
</script>
</body>
</html>
