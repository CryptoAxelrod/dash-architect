<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Dash Architect</title>
<!--
  Replace CryptoAxelrod.github.io/dash-architect below with the HTTPS
  origin engine/, render/ and addin/ are actually deployed under — same
  placeholder convention as addin/manifest.xml.
-->
<link rel="stylesheet" href="https://CryptoAxelrod.github.io/dash-architect/addin/dashboard-dialog.css">
<link rel="stylesheet" href="https://CryptoAxelrod.github.io/dash-architect/addin/theme-picker.css">
<style>
  /* Small addition, not in dashboard-dialog.css: an overlay for the column-
     role mapping screen, needed here (unlike addin/dashboard-dialog.js)
     because this page has no task pane to hand that job off to — see
     Code.gs's header comment on why this dialog is self-sufficient. */
  .mapping-overlay { position: absolute; inset: 0; background: var(--paper, #EEF1EC); z-index: 20; overflow: auto; padding: 20px 24px; }
</style>
</head>
<body>

<div class="toolbar">
  <div class="themes" id="dlg-themes">
    <button type="button" data-theme="light" aria-pressed="true">Light</button>
    <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
    <button type="button" data-theme="report" aria-pressed="false">Report</button>
    <button type="button" data-theme="print" aria-pressed="false">Print</button>
  </div>
  <div class="toolbar-actions" id="dlg-live-actions" hidden>
    <span class="source-label" id="dlg-source"></span>
    <span class="refreshed-at" id="dlg-refreshed-at"></span>
    <button type="button" class="tbtn" id="dlg-refresh">Refresh</button>
    <button type="button" class="tbtn tbtn-icon" id="dlg-settings-toggle" title="Dashboard settings" aria-label="Dashboard settings">⚙</button>
  </div>
  <p class="status" id="dlg-status" hidden></p>
</div>
<div class="banner" id="dlg-banner" hidden></div>
<div class="stage"><div class="inner" id="dlg-mount"></div></div>

<div class="settings-panel" id="dlg-settings" hidden>
  <div class="settings-head">
    <h2>Dashboard settings</h2>
    <button type="button" class="tbtn" id="dlg-settings-close">Close</button>
  </div>
  <div class="settings-section">
    <h3>Data source</h3>
    <p class="mapping-hint" id="dlg-change-range-status" hidden></p>
    <button type="button" class="tbtn" id="dlg-change-range">Change data range</button>
    <button type="button" class="btn-quiet" id="dlg-change-range-cancel" hidden>Cancel</button>
  </div>
  <div class="settings-section">
    <h3>Theme &amp; palette</h3>
    <div id="dlg-theme-picker"></div>
  </div>
  <div class="settings-section">
    <h3>Filters</h3>
    <div id="dlg-settings-filters"></div>
  </div>
  <div class="settings-section">
    <h3>KPI cards</h3>
    <div id="dlg-settings-kpis"></div>
  </div>
  <div class="settings-section">
    <h3>Charts</h3>
    <div id="dlg-settings-charts"></div>
  </div>
  <div class="settings-section">
    <h3>Table</h3>
    <div id="dlg-settings-table-columns"></div>
  </div>
  <div class="settings-section">
    <h3>Sections</h3>
    <label class="settings-row"><input type="checkbox" id="dlg-cfg-table" checked> Table</label>
    <label class="settings-row"><input type="checkbox" id="dlg-cfg-filters" checked> Filters</label>
  </div>
</div>

<!-- Column-role review — used both when "Change data range" lands on a
     source with different (>6) columns, and when the empty-state widget
     (render/dom.js#renderEmptyState) asks to review roles. Self-contained:
     unlike addin/taskpane.js's mapping screen, this one has no separate
     pane to report back to. -->
<section class="mapping-overlay" id="view-mapping" hidden>
  <div class="list-head">
    <h2>Review column roles</h2>
    <button type="button" class="btn-quiet" id="mapping-cancel">Cancel</button>
  </div>
  <p class="mapping-hint">More than 6 columns — check the roles below before continuing. Pre-filled from automatic detection.</p>
  <div class="mapping-list" id="mapping-list"></div>
  <button type="button" class="cta cta-static" id="mapping-generate">Continue</button>
</section>

<script src="https://CryptoAxelrod.github.io/dash-architect/engine/values.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/engine/csv.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/engine/clean.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/engine/profile.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/engine/roles.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/engine/aggregate.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/engine/layout.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/engine/reconcile.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/engine/index.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/render/format.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/render/palettes.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/render/themes.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/render/svg.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/render/share.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/render/dom.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/addin/theme-picker.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/addin/dashboard-io.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/addin-sheets/sheets-format-bridge.js"></script>
<script src="https://CryptoAxelrod.github.io/dash-architect/addin-sheets/sheets-io.js"></script>
<script>
(() => {
  'use strict';

  // Injected by Code.gs#openDashboardDialog via HtmlService templating —
  // {mode:'live', source, roleOverrides, title, theme, palette, shapeName, isPro}
  // or {mode:'frozen', layoutSpec, title, theme, palette}. This is the
  // ENTIRE handoff from the sidebar; see Code.gs's header comment for why
  // nothing else is exchanged between the two windows.
  const initialPayload = <?!= initialPayloadJson ?>;

  const $ = (id) => document.getElementById(id);
  const els = {};

  function gsRun(fnName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((err) => reject(err instanceof Error ? err : new Error((err && err.message) || String(err))))
        [fnName](...args);
    });
  }

  const host = {
    detectSource: () => gsRun('detectSource'),
    async readRangeForEngine(source) {
      const raw = await gsRun('readRangeRaw', source);
      const { headers, dataRows } = window.DashSheetsIo.toEngineInput(raw);
      return { headers, dataRows, totalRows: raw.totalRows, cols: raw.cols, timing: raw.timing };
    },
    listDashboards: () => gsRun('listDashboards'),
    async placeDashboard(args) {
      const payload = window.DashAddinDashboardIo.buildStoragePayload(args);
      return gsRun('generateAndPlace', { pngBase64: args.pngBase64, canvasSize: args.canvasSize, payload, shapeName: args.shapeName || undefined });
    },
  };

  const Engine = window.DashEngine;
  const THEMES = window.DashRenderThemes.THEMES;
  const Palettes = window.DashRenderPalettes;

  const state = {
    source: initialPayload.mode === 'live' ? initialPayload.source : null,
    roleOverrides: initialPayload.roleOverrides || null,
    title: initialPayload.title || null,
    theme: initialPayload.theme || 'light',
    palette: initialPayload.palette || 'ocean',
    currentShapeName: initialPayload.shapeName || null,
  };
  let dlgController = null;
  let dlgMode = null; // 'live' | 'frozen'
  let widgetConfig = { enabledKpis: null, enabledCharts: null, chartOverrides: null, showCharts: true, showTable: true, showFilters: true, showWatermark: false };
  let isPro = !!initialPayload.isPro;
  let currentAnalysis = null;
  let currentMeta = null;
  let currentSourceLabel = '';
  let canvasSize = null;
  let changeRangeActive = false;

  function activeTheme() { return Palettes.withPalette(THEMES[state.theme], state.palette); }
  function sourceLabel(source) { const s = source || state.source; return s ? s.address : ''; }

  function mappingToOverrides(mapping) {
    const overrides = {};
    for (const m of mapping) overrides[m.name] = { role: m.role, chartEligible: m.chartEligible !== false };
    return overrides;
  }
  async function findSavedMappingForSource(label) {
    if (!label) return null;
    let dashboards;
    try { dashboards = await host.listDashboards(); } catch (e) { return null; }
    const candidates = dashboards.filter((d) => d.payload.sourceAddress === label && Array.isArray(d.payload.mapping));
    if (!candidates.length) return null;
    candidates.sort((a, b) => new Date(b.payload.generatedAt || 0) - new Date(a.payload.generatedAt || 0));
    return mappingToOverrides(candidates[0].payload.mapping);
  }

  function setStatus(text, isError) { els.dlgStatus.hidden = !text; els.dlgStatus.textContent = text || ''; els.dlgStatus.dataset.error = isError ? '1' : '0'; }
  function showBanner(text, isError) { els.dlgBanner.hidden = !text; els.dlgBanner.textContent = text || ''; els.dlgBanner.dataset.error = isError ? '1' : '0'; }

  /* ---------- mapping overlay (self-contained — see the file's own doc comment) ---------- */
  const ROLE_OPTIONS = [
    ['measure', 'Measure'], ['dimension', 'Category'], ['dimension_filter', 'Filter only'],
    ['time', 'Date'], ['text', 'Text (table only)'], ['excluded', "Don't use"],
  ];
  function roleOptionFor(decision) {
    if (decision.role === 'dimension') return decision.chartEligible === false ? 'dimension_filter' : 'dimension';
    return decision.role;
  }
  function showMappingScreen(analysis, onConfirm, onCancel) {
    els.viewMapping.hidden = false;
    els.mappingList.innerHTML = '';
    const rows = analysis.columns.map((col) => {
      const row = document.createElement('div');
      row.className = 'mapping-row';
      const name = document.createElement('span');
      name.className = 'mapping-name';
      name.textContent = col.name;
      const select = document.createElement('select');
      select.className = 'mapping-select';
      for (const [value, label] of ROLE_OPTIONS) {
        const opt = document.createElement('option');
        opt.value = value; opt.textContent = label;
        select.appendChild(opt);
      }
      select.value = roleOptionFor(col.decision);
      row.append(name, select);
      els.mappingList.appendChild(row);
      return { name: col.name, select };
    });
    function onGenerateClick() {
      const overrides = {};
      for (const { name, select } of rows) {
        overrides[name] = select.value === 'dimension_filter' ? { role: 'dimension', chartEligible: false }
          : select.value === 'dimension' ? { role: 'dimension', chartEligible: true }
          : { role: select.value };
      }
      cleanup();
      onConfirm(window.DashEngine.applyRoleOverrides(analysis, overrides), overrides);
    }
    function onCancelClick() { cleanup(); if (onCancel) onCancel(); }
    function cleanup() {
      els.viewMapping.hidden = true;
      els.mappingGenerate.removeEventListener('click', onGenerateClick);
      els.mappingCancel.removeEventListener('click', onCancelClick);
    }
    els.mappingGenerate.addEventListener('click', onGenerateClick);
    els.mappingCancel.addEventListener('click', onCancelClick);
  }

  /* ---------- mount ---------- */
  function currentRawState() {
    const s = dlgController && dlgMode === 'live' ? dlgController.getState() : {};
    return {
      activeFilters: Object.fromEntries(Object.entries(s.activeFilters || {}).map(([k, v]) => [k, [...v]])),
      sort: s.sort || null, theme: state.theme, palette: state.palette, widgetConfig,
      title: currentMeta && currentMeta.title,
    };
  }

  function syncThemeButtons() {
    [...els.dlgThemes.querySelectorAll('button')].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.theme === state.theme)));
  }

  function mountFrozenDashboard(layoutSpec, theme, palette) {
    dlgMode = 'frozen';
    els.dlgLiveActions.hidden = true;
    els.dlgThemes.hidden = false;
    currentAnalysis = null;
    if (theme) state.theme = theme;
    if (palette) state.palette = palette;
    syncThemeButtons();
    canvasSize = layoutSpec.canvas;
    dlgController = window.DashRenderDom.mountFrozen(els.dlgMount, layoutSpec, activeTheme());
  }

  function mountLive(seedReconciled) {
    dlgMode = 'live';
    els.dlgLiveActions.hidden = false;
    els.dlgThemes.hidden = true;
    if (currentSourceLabel) els.dlgSource.textContent = currentSourceLabel;
    if (seedReconciled) {
      state.theme = seedReconciled.theme || state.theme;
      state.palette = seedReconciled.palette || state.palette;
      widgetConfig = seedReconciled.widgetConfig || widgetConfig;
    }
    widgetConfig = Object.assign({}, widgetConfig, { showWatermark: !isPro });
    syncThemeButtons();
    syncSettingsPanel();
    els.dlgMount.innerHTML = '';
    const initialState = seedReconciled ? { activeFilters: seedReconciled.activeFilters, sort: seedReconciled.sort } : undefined;
    const metaWithConfig = Object.assign({}, currentMeta, { widgetConfig });
    dlgController = window.DashRenderDom.mount(els.dlgMount, currentAnalysis, activeTheme(), metaWithConfig, {
      onPlaceOnSheet, onOpenMapping, initialState, onStateChange: () => {}, onTitleChange: onRenameTitle,
    });
    canvasSize = dlgController.getLayoutSpec().canvas;
  }

  function onRenameTitle(newTitle) { currentMeta = Object.assign({}, currentMeta, { title: newTitle }); state.title = newTitle; }

  async function onPlaceOnSheet(spec) {
    try {
      const baseTheme = THEMES[spec.theme || state.theme];
      const theme = Palettes.withPalette(baseTheme, spec.palette || state.palette);
      const currentSpec = { canvas: spec.canvas, widgets: spec.widgets };
      const columnsByName = Engine.Aggregate.byName(currentAnalysis.columns);
      const pngBase64 = await window.DashRenderShare.renderPngBase64(currentSpec, theme, columnsByName, { scale: 2 });
      const snapshot = Engine.Layout.buildStorageSnapshot(currentSpec, currentAnalysis.columns);
      const mapping = currentAnalysis.columns.map((c) => ({ name: c.name, role: c.decision.role, aggregation: c.decision.aggregation, chartEligible: c.decision.chartEligible !== false }));
      const { shapeName } = await host.placeDashboard({
        pngBase64, canvasSize: currentSpec.canvas, snapshot, mapping, sourceAddress: currentSourceLabel, source: state.source,
        title: state.title, theme: spec.theme || state.theme, palette: spec.palette || state.palette, shapeName: state.currentShapeName || undefined,
      });
      state.currentShapeName = shapeName;
      return { ok: true, shapeName };
    } catch (err) {
      return { ok: false, error: (err && err.message) || String(err) };
    }
  }

  function onOpenMapping() {
    return new Promise((resolve) => {
      showMappingScreen(
        currentAnalysis,
        (analysis) => {
          currentAnalysis = analysis;
          currentMeta = { title: state.title, subtitle: `${analysis.rowCount.toLocaleString('en-US')} rows` };
          mountLive(null);
          resolve({ ok: true });
        },
        () => resolve({ ok: false, error: 'cancelled' })
      );
    });
  }

  /* ---------- refresh ---------- */
  async function onRefreshClick() {
    if (els.dlgRefresh.dataset.busy) return;
    els.dlgRefresh.dataset.busy = '1';
    const original = els.dlgRefresh.textContent;
    els.dlgRefresh.textContent = 'Refreshing…';
    try {
      const seed = currentRawState();
      const { headers, dataRows } = await host.readRangeForEngine(state.source);
      const rawAnalysis = Engine.analyzeTable(headers, dataRows, ',');
      const analysis = Engine.applyRoleOverrides(rawAnalysis, state.roleOverrides);
      const changed = currentAnalysis ? Engine.Reconcile.diffValueTypes(currentAnalysis, analysis) : [];
      const seedReconciled = Engine.Reconcile.reconcileDashboardState(analysis, seed);
      currentAnalysis = analysis;
      currentMeta = { title: state.title, subtitle: `${analysis.rowCount.toLocaleString('en-US')} rows` };
      mountLive(seedReconciled);
      if (changed.length) showBanner(`Column type changed after refresh: ${changed.join(', ')}. Data was recalculated, your filters and settings were kept.`, false);
      els.dlgRefresh.textContent = 'Refreshed';
      els.dlgRefreshedAt.textContent = `Updated ${new Date().toLocaleTimeString()}`;
    } catch (err) {
      els.dlgRefresh.textContent = 'Could not refresh';
      showBanner(`Refresh failed: ${(err && err.message) || String(err)}`, true);
    }
    setTimeout(() => { els.dlgRefresh.textContent = original; delete els.dlgRefresh.dataset.busy; }, 2200);
  }

  /* ---------- change data range: entirely inline here — this dialog is
     modeless, so the sheet stays selectable while it's open; no separate
     window or pane is involved. ---------- */
  function setChangeRangeMode(active) {
    changeRangeActive = active;
    els.dlgChangeRange.textContent = active ? 'Use this range' : 'Change data range';
    els.dlgChangeRangeCancel.hidden = !active;
    els.dlgChangeRangeStatus.hidden = !active;
    if (active) els.dlgChangeRangeStatus.textContent = 'Select a new range on the sheet, then click "Use this range".';
  }

  async function completeChangeRange() {
    els.dlgChangeRangeStatus.textContent = 'Reading the new range…';
    try {
      const source = await host.detectSource();
      if (!source) { els.dlgChangeRangeStatus.textContent = 'Select some cells on the sheet first.'; return; }
      const seed = currentRawState();
      const { headers, dataRows } = await host.readRangeForEngine(source);
      const rawAnalysis = Engine.analyzeTable(headers, dataRows, ',');
      const oldNames = currentAnalysis.columns.map((c) => c.name);
      const newNames = rawAnalysis.columns.map((c) => c.name);
      const matches = Engine.Reconcile.columnsStructureMatches(oldNames, newNames);
      const overridesToCarry = matches ? state.roleOverrides : await findSavedMappingForSource(sourceLabel(source));
      state.roleOverrides = overridesToCarry;
      state.source = source;
      currentSourceLabel = sourceLabel(source);

      const finish = (finalAnalysis) => {
        currentAnalysis = finalAnalysis;
        currentMeta = { title: state.title, subtitle: `${finalAnalysis.rowCount.toLocaleString('en-US')} rows` };
        mountLive(matches ? seed : null);
        if (!matches) showBanner('The new source has different columns — filters and settings were reset.', false);
        setChangeRangeMode(false);
      };
      const withOverrides = Engine.applyRoleOverrides(rawAnalysis, overridesToCarry);
      if (!matches && withOverrides.columns.length > 6) {
        showMappingScreen(withOverrides, finish, () => setChangeRangeMode(false));
      } else {
        finish(withOverrides);
      }
    } catch (err) {
      els.dlgChangeRangeStatus.textContent = `Could not change the data source: ${(err && err.message) || String(err)}`;
    }
  }

  /* ---------- settings panel (KPIs, Filters, Charts, Table columns, Theme)
     — same logic as addin/dashboard-dialog.js; only pushState()'s message
     send is gone, since there's no separate parent window to notify. ---------- */
  function syncSettingsPanel() {
    renderDialogThemePicker(); syncFiltersSection(); syncKpiSection(); syncChartsSection(); syncTableColumnsSection();
    els.dlgCfgTable.checked = widgetConfig.showTable !== false;
    els.dlgCfgFilters.checked = widgetConfig.showFilters !== false;
  }

  function renderDialogThemePicker() {
    window.DashThemePicker.render(
      els.dlgSettingsThemePicker, { THEMES, Palettes }, { theme: state.theme, palette: state.palette },
      {
        onThemeChange: (id) => { state.theme = id; syncThemeButtons(); dlgController.setTheme(activeTheme()); renderDialogThemePicker(); },
        onPaletteChange: (id) => { state.palette = id; dlgController.setTheme(activeTheme()); renderDialogThemePicker(); },
      }
    );
  }

  function appendLimitHint(container, enabledCount, limit) {
    if (enabledCount <= limit) return;
    const p = document.createElement('p');
    p.className = 'mapping-hint';
    p.textContent = `Showing the first ${limit} of ${enabledCount} checked — uncheck one to add another.`;
    container.appendChild(p);
  }

  const AGGREGATION_OPTIONS = [['', 'Default'], ['sum', 'Sum'], ['avg', 'Average'], ['min', 'Min'], ['max', 'Max']];
  function buildAggregationSelect(value, onChange) {
    const select = document.createElement('select');
    for (const [v, label] of AGGREGATION_OPTIONS) {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = label;
      select.appendChild(opt);
    }
    select.value = value || '';
    select.addEventListener('change', () => onChange(select.value || null));
    return select;
  }

  function syncKpiSection() {
    els.dlgSettingsKpis.innerHTML = '';
    if (!currentAnalysis) return;
    const measures = currentAnalysis.columns.filter((c) => c.decision.role === 'measure');
    const enabled = widgetConfig.enabledKpis ? new Set(widgetConfig.enabledKpis) : null;
    const kpiAggregations = widgetConfig.kpiAggregations || {};
    for (const col of measures) {
      const isEnabled = enabled ? enabled.has(col.name) : true;
      const row = document.createElement('div');
      row.className = 'chart-config-row';
      const label = document.createElement('label');
      label.className = 'settings-row';
      const input = document.createElement('input');
      input.type = 'checkbox'; input.checked = isEnabled;
      input.addEventListener('change', () => onKpiToggle(col.name, input.checked, measures));
      label.append(input, document.createTextNode(' ' + col.name));
      row.appendChild(label);
      if (isEnabled) {
        const controls = document.createElement('div');
        controls.className = 'chart-config-controls';
        controls.appendChild(buildAggregationSelect(kpiAggregations[col.name], (agg) => onKpiAggregationChange(col.name, agg)));
        row.appendChild(controls);
      }
      els.dlgSettingsKpis.appendChild(row);
    }
    appendLimitHint(els.dlgSettingsKpis, enabled ? enabled.size : measures.length, Engine.Layout.LAYOUT.kpi.maxCards);
  }
  function onKpiAggregationChange(name, aggregation) {
    const current = Object.assign({}, widgetConfig.kpiAggregations);
    if (aggregation) current[name] = aggregation; else delete current[name];
    applyWidgetConfig({ kpiAggregations: Object.keys(current).length ? current : null });
  }
  function onKpiToggle(name, checked, measures) {
    const current = widgetConfig.enabledKpis ? new Set(widgetConfig.enabledKpis) : new Set(measures.map((m) => m.name));
    if (checked) current.add(name); else current.delete(name);
    applyWidgetConfig({ enabledKpis: [...current] });
  }

  function syncFiltersSection() {
    els.dlgSettingsFilters.innerHTML = '';
    if (!currentAnalysis) return;
    const dimensions = currentAnalysis.columns.filter((c) => c.decision.role === 'dimension');
    if (!dimensions.length) {
      const p = document.createElement('p'); p.className = 'mapping-hint'; p.textContent = 'No filterable columns for this data.';
      els.dlgSettingsFilters.appendChild(p); return;
    }
    const enabled = widgetConfig.enabledDimensions ? new Set(widgetConfig.enabledDimensions) : null;
    for (const col of dimensions) {
      const label = document.createElement('label');
      label.className = 'settings-row';
      const input = document.createElement('input');
      input.type = 'checkbox'; input.checked = enabled ? enabled.has(col.name) : true;
      input.addEventListener('change', () => onFilterToggle(col.name, input.checked, dimensions));
      label.append(input, document.createTextNode(' ' + col.name));
      els.dlgSettingsFilters.appendChild(label);
    }
    appendLimitHint(els.dlgSettingsFilters, enabled ? enabled.size : dimensions.length, Engine.Layout.LAYOUT.filterBar.maxVisible);
  }
  function onFilterToggle(name, checked, dimensions) {
    const current = widgetConfig.enabledDimensions ? new Set(widgetConfig.enabledDimensions) : new Set(dimensions.map((d) => d.name));
    if (checked) current.add(name); else current.delete(name);
    applyWidgetConfig({ enabledDimensions: [...current] });
  }

  function syncTableColumnsSection() {
    els.dlgSettingsTableColumns.innerHTML = '';
    if (!currentAnalysis) return;
    const tableColumns = currentAnalysis.columns.filter((c) => c.decision.role !== 'excluded');
    if (!tableColumns.length) {
      const p = document.createElement('p'); p.className = 'mapping-hint'; p.textContent = 'No columns to show.';
      els.dlgSettingsTableColumns.appendChild(p); return;
    }
    const enabled = widgetConfig.enabledTableColumns ? new Set(widgetConfig.enabledTableColumns) : null;
    for (const col of tableColumns) {
      const label = document.createElement('label');
      label.className = 'settings-row';
      const input = document.createElement('input');
      input.type = 'checkbox'; input.checked = enabled ? enabled.has(col.name) : true;
      input.addEventListener('change', () => onTableColumnToggle(col.name, input.checked, tableColumns));
      label.append(input, document.createTextNode(' ' + col.name));
      els.dlgSettingsTableColumns.appendChild(label);
    }
  }
  function onTableColumnToggle(name, checked, tableColumns) {
    const current = widgetConfig.enabledTableColumns ? new Set(widgetConfig.enabledTableColumns) : new Set(tableColumns.map((c) => c.name));
    if (checked) current.add(name); else current.delete(name);
    applyWidgetConfig({ enabledTableColumns: [...current] });
  }

  function syncChartsSection() {
    els.dlgSettingsCharts.innerHTML = '';
    if (!currentAnalysis) return;
    const Layout = Engine.Layout;
    const sel = Layout.selectColumns(currentAnalysis.columns);
    const allCharts = Layout.planCharts(sel);
    if (!allCharts.length) {
      const p = document.createElement('p'); p.className = 'mapping-hint'; p.textContent = 'No eligible charts for this data.';
      els.dlgSettingsCharts.appendChild(p); return;
    }
    const enabledSet = widgetConfig.enabledCharts ? new Set(widgetConfig.enabledCharts) : null;
    const overridesByChart = widgetConfig.chartOverrides || {};
    for (const plan of allCharts) {
      const effective = Layout.applyChartOverride(plan, sel, overridesByChart[plan.id]);
      const enabled = enabledSet ? enabledSet.has(plan.id) : true;
      const measureName = (effective.measure || sel.primaryMeasure).name;
      const row = document.createElement('div');
      row.className = 'chart-config-row';
      const head = document.createElement('label');
      head.className = 'settings-row';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = enabled;
      cb.addEventListener('change', () => onChartEnabledToggle(plan.id, cb.checked, allCharts));
      head.appendChild(cb);
      const label = plan.kind === 'line' ? `${measureName} over time` : `${measureName} ${effective.overrideType === 'donut' ? 'share of' : 'by'} ${effective.dimension.name}`;
      head.appendChild(document.createTextNode(' ' + label));
      row.appendChild(head);
      if (enabled) {
        const controls = document.createElement('div');
        controls.className = 'chart-config-controls';
        if (plan.kind === 'bar') {
          const typeSelect = document.createElement('select');
          for (const t of Layout.CHART_TYPE_OPTIONS.bar) {
            const opt = document.createElement('option');
            opt.value = t; opt.textContent = t === 'horizontalBar' ? 'Horizontal bar' : t === 'donut' ? 'Donut' : 'Bar';
            typeSelect.appendChild(opt);
          }
          typeSelect.value = effective.overrideType || Layout.defaultBarType(effective.dimension);
          typeSelect.addEventListener('change', () => onChartOverrideChange(plan.id, { type: typeSelect.value }));
          controls.appendChild(typeSelect);
          const dimSelect = document.createElement('select');
          const eligibleDims = sel.dimensions.filter((d) => d.profile.uniqueCount <= Layout.LAYOUT.chart.maxDimensionCardinality);
          for (const d of eligibleDims) {
            const opt = document.createElement('option');
            opt.value = d.name; opt.textContent = d.name;
            dimSelect.appendChild(opt);
          }
          dimSelect.value = effective.dimension.name;
          dimSelect.addEventListener('change', () => onChartOverrideChange(plan.id, { dimensionColumn: dimSelect.value }));
          controls.appendChild(dimSelect);
        }
        const measureSelect = document.createElement('select');
        for (const m of sel.measures) {
          const opt = document.createElement('option');
          opt.value = m.name; opt.textContent = m.name;
          measureSelect.appendChild(opt);
        }
        measureSelect.value = measureName;
        measureSelect.addEventListener('change', () => onChartOverrideChange(plan.id, { measureColumn: measureSelect.value }));
        controls.appendChild(measureSelect);
        controls.appendChild(buildAggregationSelect(effective.overrideAggregation, (agg) => onChartOverrideChange(plan.id, { aggregation: agg })));
        row.appendChild(controls);
      }
      els.dlgSettingsCharts.appendChild(row);
    }
    appendLimitHint(els.dlgSettingsCharts, enabledSet ? enabledSet.size : allCharts.length, Layout.LAYOUT.chart.maxCount);
  }
  function onChartEnabledToggle(chartId, checked, allCharts) {
    const current = widgetConfig.enabledCharts ? new Set(widgetConfig.enabledCharts) : new Set(allCharts.map((c) => c.id));
    if (checked) current.add(chartId); else current.delete(chartId);
    applyWidgetConfig({ enabledCharts: [...current] });
  }
  function onChartOverrideChange(chartId, patch) {
    const overrides = Object.assign({}, widgetConfig.chartOverrides);
    overrides[chartId] = Object.assign({}, overrides[chartId], patch);
    applyWidgetConfig({ chartOverrides: overrides });
  }
  function applyWidgetConfig(patch) {
    widgetConfig = Object.assign({}, widgetConfig, patch);
    const reconciled = { activeFilters: currentRawState().activeFilters, sort: currentRawState().sort, theme: state.theme, palette: state.palette, widgetConfig };
    mountLive(reconciled);
  }

  /* ---------- wiring + boot ---------- */
  function wireToolbar() {
    els.dlgThemes.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-theme]');
      if (!btn || !dlgController) return;
      state.theme = btn.dataset.theme;
      syncThemeButtons();
      dlgController.setTheme(activeTheme());
      if (!els.dlgSettingsPanel.hidden) renderDialogThemePicker();
    });
    els.dlgRefresh.addEventListener('click', onRefreshClick);
    els.dlgChangeRange.addEventListener('click', () => { if (!changeRangeActive) setChangeRangeMode(true); else completeChangeRange(); });
    els.dlgChangeRangeCancel.addEventListener('click', () => setChangeRangeMode(false));
    els.dlgSettingsToggle.addEventListener('click', () => { syncSettingsPanel(); els.dlgSettingsPanel.hidden = false; });
    els.dlgSettingsClose.addEventListener('click', () => { els.dlgSettingsPanel.hidden = true; });
    els.dlgCfgTable.addEventListener('change', () => applyWidgetConfig({ showTable: els.dlgCfgTable.checked }));
    els.dlgCfgFilters.addEventListener('change', () => applyWidgetConfig({ showFilters: els.dlgCfgFilters.checked }));
  }

  async function boot() {
    Object.assign(els, {
      dlgThemes: $('dlg-themes'), dlgStatus: $('dlg-status'), dlgBanner: $('dlg-banner'), dlgMount: $('dlg-mount'),
      dlgLiveActions: $('dlg-live-actions'), dlgSource: $('dlg-source'), dlgRefreshedAt: $('dlg-refreshed-at'), dlgRefresh: $('dlg-refresh'),
      dlgChangeRange: $('dlg-change-range'), dlgChangeRangeCancel: $('dlg-change-range-cancel'), dlgChangeRangeStatus: $('dlg-change-range-status'),
      dlgSettingsToggle: $('dlg-settings-toggle'), dlgSettingsPanel: $('dlg-settings'), dlgSettingsClose: $('dlg-settings-close'),
      dlgSettingsThemePicker: $('dlg-theme-picker'), dlgSettingsFilters: $('dlg-settings-filters'), dlgSettingsKpis: $('dlg-settings-kpis'),
      dlgSettingsCharts: $('dlg-settings-charts'), dlgSettingsTableColumns: $('dlg-settings-table-columns'),
      dlgCfgTable: $('dlg-cfg-table'), dlgCfgFilters: $('dlg-cfg-filters'),
      viewMapping: $('view-mapping'), mappingList: $('mapping-list'), mappingGenerate: $('mapping-generate'), mappingCancel: $('mapping-cancel'),
    });
    wireToolbar();
    setStatus('Loading dashboard data…');
    try {
      if (initialPayload.mode === 'frozen') {
        mountFrozenDashboard(initialPayload.layoutSpec, initialPayload.theme, initialPayload.palette);
      } else {
        const { headers, dataRows } = await host.readRangeForEngine(state.source);
        const rawAnalysis = Engine.analyzeTable(headers, dataRows, ',');
        currentAnalysis = Engine.applyRoleOverrides(rawAnalysis, state.roleOverrides);
        currentMeta = { title: state.title, subtitle: `${currentAnalysis.rowCount.toLocaleString('en-US')} rows` };
        currentSourceLabel = sourceLabel(state.source);
        mountLive(null);
      }
      setStatus('');
    } catch (err) {
      setStatus(`Could not load the dashboard: ${(err && err.message) || String(err)}`, true);
    }
  }
  boot();
})();
</script>
</body>
</html>
